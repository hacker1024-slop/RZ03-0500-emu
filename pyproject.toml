[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "razer-keyboard-emulator"
version = "0.1.0"
description = "Firmware-driven BlackWidow V4 75% emulation with Renode"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["pyrenode3 @ git+https://github.com/antmicro/pyrenode3.git@27362def38ce409b95c972ce494cd8517dac17a4"]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]

[project.scripts]
razer-emu = "razer_emu_cli.main:main"
razer-emu-gui = "razer_emu_gui.main:main"

[tool.setuptools.packages.find]
include = ["razer_emu", "razer_emu_cli", "razer_emu_gui"]

[tool.setuptools.package-data]
razer_emu = ["platforms/*.repl", "platforms/*.cs"]
razer_emu_gui = ["qml/*.qml", "assets/*.json", "assets/*.svg", "assets/*.png"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
